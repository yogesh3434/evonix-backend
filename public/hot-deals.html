<!DOCTYPE html>
<html>
<head>
  <title>EvoNix - Hot Deals</title>
</head>
<body>
  <h1>Hot Deals</h1>
  <p>
    <a href="/index.html">Catalogue</a> |
    <a href="/hot-deals.html">Hot Deals</a> |
    <a href="/cart.html">Cart</a> |
    <a href="/login.html">Sign In</a>
  </p>

  <div id="results">Loading...</div>

  <script>
    async function loadHotDeals() {
      const response = await fetch('/api/vehicles/hot-deals');
      const result = await response.json();

      const container = document.getElementById('results');
      container.innerHTML = '';

      result.data.forEach(function (vehicle) {
        const block = document.createElement('div');
        block.innerHTML =
          '<h3><a href="/vehicle.html?id=' + vehicle.id + '">' + vehicle.name + '</a></h3>' +
          '<p>Original Price: $' + vehicle.price + '</p>' +
          '<p>Hot Deal Price: $' + vehicle.hotDealPrice + '</p>' +
          '<hr>';
        container.appendChild(block);
      });
    }

    loadHotDeals();
  </script>
</body>
</html>
